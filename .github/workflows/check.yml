# Quality gate: runs scripts/check.sh (staged-env check, lint, typecheck, tests,
# optional gitleaks) on every push and pull request. It never touches a database
# (dummy DATABASE_URL values only) and never deploys anything.
name: Check

# Branch pushes and pull requests; tag pushes are skipped.
on:
  push:
    branches: ['**']
  pull_request:

# Least privilege: this job only needs to read the repository; no secrets at all.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR so outdated commits don't queue up.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # fail fast if the runner or install hangs
    env:
      # Dummy database URLs: 127.0.0.1:1 has no listener, so any accidental
      # connection attempt fails immediately. No real credentials are used.
      DATABASE_URL: "postgresql://none:none@127.0.0.1:1/none"
      DATABASE_URL_UNPOOLED: "postgresql://none:none@127.0.0.1:1/none"
    steps:
      # Pinned to a full commit SHA (of the v4 tag) to prevent supply-chain
      # drift if the action repo is compromised; the tag is noted for readability.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Node 24: transitive deps (file-type, mixpart) require Node >= 22, and the
      # repo runs and deploys on Node 24.x (see README, Vercel settings).
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm # reuse the npm cache across runs, keyed by package-lock.json

      # npm ci installs exactly what package-lock.json says (the lockfile is
      # tracked and in sync with package.json), and fails if they ever drift.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The repo's own quality gate; needs no --build, so no build step here.
      - name: Run quality gate
        run: bash scripts/check.sh
